[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldbridge"
version = "0.1.0"
description = "No-LLM mechanism translation across scientific fields."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "FieldBridge contributors" }
]
keywords = ["equations", "mechanisms", "analogy", "scientific-discovery", "knowledge-graph"]
dependencies = []

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11"]
construction = ["sympy>=1.12,<2", "numpy>=1.24,<3"]
memory = ["sympy>=1.12,<2", "numpy>=1.24,<3", "scipy>=1.10", "matplotlib>=3.7"]

[project.scripts]
fieldbridge = "fieldbridge.cli:main"

[tool.setuptools]
packages = ["fieldbridge", "fieldbridge.memory", "fieldbridge.quantum"]

[tool.setuptools.package-data]
fieldbridge = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
