<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">FieldBridge implementation flow</title>
  <desc id="desc">Documents are ingested, converted into operational representations, retrieved or constructed across fields, and evaluated with complete-paper and future-state tests.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#2457d6" stroke-width="1.8"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    .ink { fill: #171918; }
    .muted { fill: #626861; }
    .blue { fill: #2457d6; }
    .green { fill: #177f63; }
    .box { fill: #ffffff; stroke: #cfd3cc; stroke-width: 1.5; }
    .soft { fill: #eef3ff; stroke: #b9c8ef; stroke-width: 1.5; }
    .greenbox { fill: #edf7f2; stroke: #b6d9cc; stroke-width: 1.5; }
    .line { fill: none; stroke: #2457d6; stroke-width: 2.4; marker-end: url(#arrow); }
    .rule { stroke: #d7dad4; stroke-width: 1.3; }
  </style>
  <rect width="1200" height="500" rx="8" fill="#f7f7f4"/>
  <text x="48" y="52" class="mono green" font-size="16" font-weight="700">IMPLEMENTATION MAP</text>
  <text x="48" y="91" class="sans ink" font-size="34" font-weight="730">From document to testable transfer</text>
  <line x1="48" y1="116" x2="1152" y2="116" class="rule"/>
  <g transform="translate(48 150)">
    <rect width="242" height="150" rx="6" class="box"/>
    <text x="22" y="34" class="mono blue" font-size="15" font-weight="700">01  INGEST</text>
    <text x="22" y="70" class="sans ink" font-size="22" font-weight="680">Document input</text>
    <text x="22" y="102" class="sans muted" font-size="18">PDF / TeX / Markdown / text</text>
    <text x="22" y="132" class="mono muted" font-size="16">read_document</text>
  </g>
  <path d="M300 225 H338" class="line"/>
  <g transform="translate(348 150)">
    <rect width="242" height="150" rx="6" class="soft"/>
    <text x="22" y="34" class="mono blue" font-size="15" font-weight="700">02  REPRESENT</text>
    <text x="22" y="70" class="sans ink" font-size="22" font-weight="680">Operational identity</text>
    <text x="22" y="102" class="sans muted" font-size="18">routes + fibers + roles</text>
    <text x="22" y="132" class="mono muted" font-size="16">fingerprint_text</text>
  </g>
  <path d="M600 225 H638" class="line"/>
  <g transform="translate(648 150)">
    <rect width="242" height="150" rx="6" class="greenbox"/>
    <text x="22" y="34" class="mono green" font-size="15" font-weight="700">03  BRIDGE</text>
    <text x="22" y="70" class="sans ink" font-size="22" font-weight="680">Retrieve or construct</text>
    <text x="22" y="102" class="sans muted" font-size="18">preserve / replace / attach</text>
    <text x="22" y="132" class="mono muted" font-size="16">construct_transfer</text>
  </g>
  <path d="M900 225 H938" class="line"/>
  <g transform="translate(948 150)">
    <rect width="204" height="150" rx="6" class="box"/>
    <text x="22" y="34" class="mono blue" font-size="15" font-weight="700">04  TEST</text>
    <text x="22" y="70" class="sans ink" font-size="22" font-weight="680">Evaluate</text>
    <text x="22" y="102" class="sans muted" font-size="18">paper holdout + future state</text>
    <text x="22" y="132" class="mono muted" font-size="16">validate_*</text>
  </g>
  <g transform="translate(48 342)">
    <rect width="518" height="110" rx="6" class="box"/>
    <text x="22" y="35" class="mono green" font-size="15" font-weight="700">CORPUS SIDE</text>
    <text x="22" y="70" class="sans ink" font-size="20" font-weight="680">PDF folder -&gt; field adapter + evidence graph</text>
    <text x="22" y="96" class="mono muted" font-size="16">build_pdf_field_pack</text>
  </g>
  <g transform="translate(594 342)">
    <rect width="558" height="110" rx="6" class="box"/>
    <text x="22" y="35" class="mono blue" font-size="15" font-weight="700">PUBLIC CONTRACT</text>
    <text x="22" y="70" class="sans ink" font-size="20" font-weight="680">M=(Omega,Xi) -&gt; I_op=(M;C,R,P) -&gt; I_real</text>
    <text x="22" y="96" class="mono muted" font-size="16">models.py / field packs / source evidence</text>
  </g>
</svg>
