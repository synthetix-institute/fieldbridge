name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[construction,memory]' pytest
      - name: Check every material specification
        run: python -B -m fieldbridge memory check --structure-only examples/memory/*.json examples/memory/oscillators/*.json
      - name: Tests
        run: python -B -m pytest -q -p no:cacheprovider
